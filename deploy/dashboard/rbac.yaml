# Access of the demo dashboard (deploy/dashboard/): it reads the state of the cluster and the logs,
# and it can kill a replica or restart a service, which is what the demonstrations need.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard
  namespace: aisafe
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aisafe-dashboard
rules:
  - apiGroups: [""]
    resources: [nodes, pods, pods/log, services, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [apps]
    resources: [statefulsets, daemonsets]
    verbs: [get, list, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list]
  - apiGroups: [metallb.io]
    resources: [servicel2statuses]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aisafe-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aisafe-dashboard
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: aisafe
