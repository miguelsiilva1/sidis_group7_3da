spring.application.name=aircraft-maintenance
spring.profiles.active=jpa
server.port=${PORT:8081}

# Replica identity and peers (comma-separated base URLs of the other replicas).
# In k3s: NODE_ID is the pod name and PEERS lists the other pods of the StatefulSet.
aisafe.node.id=${NODE_ID:local}
aisafe.peers=${PEERS:}
# Only this replica loads the seed data; empty means every replica does (local development).
aisafe.bootstrap.seed-node=${SEED_NODE:}
# On shutdown, refuse new requests for this long before stopping, so the entries send them
# elsewhere (0 = stop at once, for local development and tests).
aisafe.shutdown.drain-ms=${DRAIN_MS:0}

# JWT signing secret shared with the login service. The default is for local development
# only; in k3s it comes from the aisafe-jwt Secret.
security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Each replica has its own database. In k3s: an H2 file on the pod's disk.
spring.datasource.url=${DB_URL:jdbc:h2:mem:aircraftmaintenance}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# The structure of the database comes from the files in db/migration (Flyway), applied once and in
# order; Hibernate only checks that it matches the entities. A change to an entity needs a new file.
spring.jpa.hibernate.ddl-auto=validate
# A database created before Flyway (by Hibernate) is taken as being at version 1.
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=false

springdoc.swagger-ui.operations-sorter=alpha

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

aisafe.maintenance.threshold.default-flight-hours=300
aisafe.maintenance.threshold.default-days=365

# Links in responses use the address the client called (X-Forwarded-* headers), also when a
# peer answers a forwarded request.
server.forward-headers-strategy=framework
# Every log line shows the replica and the correlation id of the request.
logging.pattern.level=%5p [%X{nodeId:-},%X{correlationId:-}]
