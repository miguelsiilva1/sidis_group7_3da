oke-width:0.5;" fill="#FEFFDD"/><path d="M1001.568,43.488 L1001.568,53.488 L1011.568,53.488 L1001.568,43.488" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="365.42" y="63.957" fill="#000" font-size="16" textLength="159.672" font-weight="700">Provided interfaces</text><text x="365.42" y="82.801" fill="#000" font-size="16" textLength="151.555">Auth API: /api/auth</text><text x="365.42" y="101.645" fill="#000" font-size="16" textLength="181.047">Flights API: /api/flights</text><text x="365.42" y="120.488" fill="#000" font-size="16" textLength="490.711">Airports &amp; Routes API: /api/airports, /api/routes, /api/network</text><text x="365.42" y="139.332" fill="#000" font-size="16" textLength="631.148">Aircraft &amp; Maintenance API: /api/aircrafts, /api/aircraftModels, /api/maintenance</text><text x="365.42" y="158.176" fill="#000" font-size="16" textLength="602.523">Routes internal: C2 GET /internal/routes/{o}/{d}, C5 PUT /internal/flights/{id}</text><text x="365.42" y="177.02" fill="#000" font-size="16" textLength="382.977">Aircraft internal: C1 GET /internal/aircrafts/{reg},</text><text x="375.545" y="195.863" fill="#000" font-size="16" textLength="550.82">C3 GET /internal/aircraft-models/{name}, C4 PUT /internal/flights/{id}</text><text x="365.42" y="214.707" fill="#000" font-size="16"> </text><text x="365.42" y="233.551" fill="#000" font-size="16" textLength="142.297" font-weight="700">Every component</text><text x="512.779" y="233.551" fill="#000" font-size="16" textLength="409">runs as 3 equal replicas, each with its own database,</text><text x="365.42" y="252.395" fill="#000" font-size="16" textLength="533.602">which also offer and require /internal/replicas/** among themselves</text><text x="365.42" y="271.238" fill="#000" font-size="16" textLength="586.008">(forwarding, replication, sync). Dependencies between services go one way:</text><text x="365.42" y="290.082" fill="#000" font-size="16" textLength="584.203">flight-ops -> airports-routes -> aircraft-maintenance. Nobody calls login:</text><text x="365.42" y="308.926" fill="#000" font-size="16" textLength="302">the services check the JWT themselves.</text></g><!--link client to authApi--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk12" data-source-line="22" data-link-type="dependency"><path d="M278.68,204.298 C229.52,253.658 119.058,364.555 87.978,395.775" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="client-to-authApi"/><polygon points="84.45,399.318,93.634,395.762,87.978,395.775,87.965,390.118,84.45,399.318" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link client to foApi--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk13" data-source-line="23" data-link-type="dependency"><path d="M284.99,220.228 C261.72,274.978 222.735,366.726 210.805,394.806" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="client-to-foApi"/><polygon points="208.85,399.408,216.051,392.689,210.805,394.806,208.688,389.561,208.85,399.408" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link client to arApi--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk14" data-source-line="24" data-link-type="dependency"><path d="M306.19,219.928 C318.73,322.788 351.856,594.475 357.936,644.405" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="client-to-arApi"/><polygon points="358.54,649.368,361.423,639.951,357.936,644.405,353.481,640.918,358.54,649.368" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link client to amApi--><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk15" data-source-line="25" data-link-type="dependency"><path d="M311.52,220.178 C318.94,247.598 329.76,285.058 341.49,317.298 C389.72,449.848 435.68,470.968 468.49,608.148 C485.02