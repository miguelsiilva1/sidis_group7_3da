<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1023px;height:1109px;background:#FFFFFF;" width="1023px" height="1109px" viewBox="0 0 1023 1109" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="318.348" y="22.995" fill="#000" font-size="14" textLength="379.736" font-weight="700">AISafe - Logical view (UML components, level 1)</text></g><!--entity client--><g class="entity" data-qualified-name="client" id="ent0001" data-source-line="8"><ellipse cx="292.49" cy="147.857" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M292.49,155.857 L292.49,182.857 M279.49,163.857 L305.49,163.857 M292.49,182.857 L279.49,197.857 M292.49,182.857 L305.49,197.857" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="269.33" y="214.208" fill="#000" font-size="16" textLength="46.32">Client</text></g><!--entity authApi--><g class="entity" data-qualified-name="authApi" id="ent0002" data-source-line="10"><ellipse cx="71.49" cy="405.047" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="37.541" y="436.898" fill="#000" font-size="16" textLength="67.898">Auth API</text></g><!--entity foApi--><g class="entity" data-qualified-name="foApi" id="ent0003" data-source-line="11"><ellipse cx="199.49" cy="405.047" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="157.791" y="436.898" fill="#000" font-size="16" textLength="83.398">Flights API</text></g><!--entity arApi--><g class="entity" data-qualified-name="arApi" id="ent0004" data-source-line="12"><ellipse cx="364.49" cy="527.047" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="278.666" y="558.898" fill="#000" font-size="16" textLength="171.648">Airports &amp; Routes API</text></g