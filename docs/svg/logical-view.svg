ight="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="359.835" y="789.047" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="238.14" y="812.898" fill="#000" font-size="16" textLength="118.695">airports-routes</text></g><!--entity am--><g class="entity" data-qualified-name="am" id="ent0009" data-source-line="18"><rect x="264.23" y="1046.677" width="208.508" height="48.625" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="452.738" y="1051.677" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="450.738" y="1053.677" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="450.738" y="1057.677" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="279.23" y="1081.528" fill="#000" font-size="16" textLength="168.508">aircraft-maintenance</text></g><!--entity arInternal--><g class="entity" data-qualified-name="arInternal" id="ent0010" data-source-line="20"><ellipse cx="236.49" cy="668.047" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="175.361" y="699.898" fill="#000" font-size="16" textLength="122.258">Routes internal</text><text x="175.361" y="718.523" fill="#000" font-size="16" textLength="65.359">(C2, C5)</text></g><!--entity amInternal--><g class="entity" data-qualified-name="amInternal" id="ent0011" data-source-line="21"><ellipse cx="302.49" cy="936.677" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="239.584" y="968.528" fill="#000" font-size="16" textLength="125.813">Aircraft internal</text><text x="239.584" y="987.153" fill="#000" font-size="16" textLength="96.883">(C1, C3, C4)</text></g><g class="entity" data-qualified-name="contracts" id="ent0025" data-source-line="40"><path d="M350.55,43.297 L350.55,314.047 L1008.433,314.047 L1008.433,53.297 L998.433,43.297 L350.55,43.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M998.433,43.297 L998.433,53.297 L1008.433,53.297 L998.433,43.297" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="356.55" y="63.148" fill="#000" font-size="16" textLength="176.734" font-weight="700">Provided interfaces</text><text x="356.55" y="81.773" fill="#000" font-size="16" textLength="149.922">Auth API: /api/auth</text><text x="356.55" y="100.398" fill="#000" font-size="16" textLength="178.492">Flights API: /api/flights</text><text x="356.55" y="119.023" fill="#000" font-size="16" textLength="485.93">Airports &amp; Routes API: /api/airports, /api/routes, /api/network</text><text x="356.55" y="137.648" fill="#000" font-size="16" textLength="636.883">Aircraft &amp; Maintenance API: /api/aircrafts, /api/aircraftModels, /api/maintenance</text><text x="356.55" y="156.273" fill="#000" font-size="16" textLength="626.461">Routes internal: C2 GET /internal/routes/{o}/{d}, C5 PUT /internal/flights/{id}</text><text x="356.55" y="174.898" fill="#000" font-size="16" textLength="396.211">Aircraft internal: C1 GET /internal/aircrafts/{reg},</text><text x="366.722" y="193.523" fill="#000" font-size="16" textLength="564.289">C3 GET /internal/aircraft-models/{name}, C4 PUT /internal/flights/{id}</text><text x="356.55" y="212.148" fill="#000" font-size="16"> </text><text x="356.55" y="230.773" fill="#000" font-size="16" textLength="156.977" font-weight="700">Every component</text><text x="518.613" y="230.773" fill="#000" font-size="16" textLength="425.039">runs as 3 equal replicas, each with its own database,</text><text x="356.55" y="249.398" fill="#000" font-size="16" textLength="543.594">which also offer and require /internal/replicas/** among themselves</text><text x="356.55" y="268.023" fill="#000" font-size="16" textLength="612.43">(forwarding, replication, sync). Dependencies between services go one way:</text><text x="356.55" y="286.648" fill="#000" font-size="16" textLength="582.922">flight-ops -> airports-routes -> aircraft-maintenance. Nobody calls login:</text><text x="356.55" y="305.273" fill="#000" font-size="16" textLength="317.953">the services check the JWT themselves.</text></g><!--link client to authApi--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk12" data-source-line="23" data-link-type="dependency"><path d="M268.84,203.687 C219.84,253.427 112.819,362.085 82.699,392.665" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="client-to-authApi"/><polygon points="79.19,396.227,88.355,392.622,82.699,392.665,82.656,387.008,79.19,396.227" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link client to foApi--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk13" data-source-line="24" data-link-type="dependency"><path d="M276.5,218.247 C253.96,272.627 216.214,363.698 204.654,391.588" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="client-to-foApi"/><polygon points="202.74,396.207,209.881,389.424,204.654,391.588,202.491,386.361,202.74,396.207" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link client to arApi--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk14" data-source-line="25" data-link-type="dependency"><path d="M300.54,218.397 C317.2,298.547 353.572,473.552 361.832,513.292" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="client-to-arApi"/><polygon points="362.85,518.187,364.935,508.561,361.832,513.292,357.102,510.189,362.85,518.187" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link client to amApi--><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk15" data-source-line="26" data-link-type="dependency"><path d="M300.34,218.477 C306.88,246.137 317.68,283.637 333.49,314.047 C380.81,405.077 428.46,404.867 475.49,496.047 C505.74,554.6