"/><text x="225.15" y="118.457" fill="#000" font-size="16" textLength="45.148">Client</text><text x="225.15" y="137.301" fill="#000" font-size="16" textLength="72.508">(any role)</text></g><!--entity envoy--><g class="entity" data-qualified-name="envoy" id="ent0002" data-source-line="8"><rect x="64.39" y="239.518" width="140.031" height="48.844" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="184.421" y="244.518" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="182.421" y="246.518" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="182.421" y="250.518" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="79.39" y="274.987" fill="#000" font-size="16" textLength="100.031">Entry (Envoy)</text></g><!--entity services--><g class="entity" data-qualified-name="services" id="ent0003" data-source-line="9"><rect x="287.53" y="220.678" width="203.742" height="86.531" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="471.272" y="225.678" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="469.272" y="227.678" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="469.272" y="231.678" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="302.53" y="256.147" fill="#000" font-size="16" textLength="163.742">aircraft-maintenance</text><text x="302.53" y="274.991" fill="#000" font-size="16" textLength="119.211">airports-routes</text><text x="302.53" y="293.835" fill="#000" font-size="16" textLength="78.336">flight-ops</text></g><!--entity publicApi--><g class="entity" data-qualified-name="publicApi" id="ent0004" data-source-line="11"><ellipse cx="134.41" cy="444.058" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="6" y="476.527" fill="#000" font-size="16" textLength="167.438">POST /api/auth/login</text><text x="6" y="495.371" fill="#000" font-size="16" textLength="256.82">POST /api/auth/register (ADMIN)</text></g><!--entity accountsApi--><g class="entity" data-qualified-name="accountsApi" id="ent0005" data-source-line="12"><ellipse cx="486.41" cy="444.058" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="348.609" y="476.527" fill="#000" font-size="16" textLength="275.602">GET /internal/accounts/{username}</text><text x="348.609" y="495.371" fill="#000" font-size="16" textLength="72.625">(SERVICE)</text></g><g class="entity" data-qualified-name="GMN18" id="ent0019" data-source-line="32"><path d="M477.66,705.588 L477.66,753.698 L339.39,757.698 L477.66,761.698 L477.66,809.807 A0,0 0 0 0 477.66,809.807 L971.145,809.807 A0,0 0 0 0 971.145,809.807 L971.145,715.588 L961.145,705.588 L477.66,705.588 A0,0 0 0 0 477.66,705.588" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M961.145,705.588 L961.145,715.588 L971.145,715.588 L961.145,705.588" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="483.66" y="726.057" fill="#000" font-size="16" textLength="425.977">Every login holds every account (catalog) and signs the</text><text x="483.66" y="744.901" fill="#000" font-size="16" textLength="345.625">JWT with the secret shared with the services.</text><text x="483.66" y="763.745" fill="#000" font-size="16" textLength="472.484">The services never call login: they check the JWT themselves.</text><text x="483.66" y="782.588" fill="#000" font-size="16" textLength="412.648">An account created moments ago on another login is</text><text x="483.66" y="801.432" fill="#000" font-size="16" textLength="404.477">asked to the peers (/internal/accounts/{username}).</text></g><!--link client to envoy--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk10" data-source-line="20" data-link-type="dependency"><path d="M224.84,103.498 C193.81,114.698 151.25,135.668 131.41,170.678 C119.55,1