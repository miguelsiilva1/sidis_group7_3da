="163.172">POST /api/auth/login</text><text x="6" y="493.023" fill="#000" font-size="16" textLength="257.578">POST /api/auth/register (ADMIN)</text></g><!--entity accountsApi--><g class="entity" data-qualified-name="accountsApi" id="ent0005" data-source-line="13"><ellipse cx="487.789" cy="442.547" rx="8" ry="8" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="343.828" y="474.398" fill="#000" font-size="16" textLength="287.922">GET /internal/accounts/{username}</text><text x="343.828" y="493.023" fill="#000" font-size="16" textLength="80.813">(SERVICE)</text></g><g class="entity" data-qualified-name="GMN18" id="ent0019" data-source-line="33"><path d="M478.659,703.417 L478.659,750.977 L345.799,754.977 L478.659,758.977 L478.659,806.542 A0,0 0 0 0 478.659,806.542 L994.917,806.542 A0,0 0 0 0 994.917,806.542 L994.917,713.417 L984.917,703.417 L478.659,703.417 A0,0 0 0 0 478.659,703.417" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M984.917,703.417 L984.917,713.417 L994.917,713.417 L984.917,703.417" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="484.659" y="723.268" fill="#000" font-size="16" textLength="446.273">Every login holds every account (catalog) and signs the</text><text x="484.659" y="741.893" fill="#000" font-size="16" textLength="361.586">JWT with the secret shared with the services.</text><text x="484.659" y="760.518" fill="#000" font-size="16" textLength="495.258">The services never call login: they check the JWT themselves.</text><text x="484.659" y="779.143" fill="#000" font-size="16" textLength="426.375">An account created moments ago on another login is</text><text x="484.659" y="797.768" fill="#000" font-size="16" textLength="422.953">asked to the peers (/internal/accounts/{username}).</text></g><!--link client to envoy--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk10" data-source-line="21" data-link-type="dependency"><path d="M226.569,103.247 C194.759,114.327 151.989,134.